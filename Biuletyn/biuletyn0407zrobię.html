    <script>

            email: "bdyk@op.pl",
            
            komentarzWstepny: {

                tresc: `Wylosowane przez Isię rozdanie jest bardzo ciekawe i porusza dwa problemy<br>
                1. Młodsze kolory (♦ ♣) kontra starsze (♥ ♠)<br>
                2. Bronić czy nie bronić niepewnej końcówki<br>
                Oto całe rozdanie. Obie strony po partii, rozdawał N.`
            },
            
            rozdania: [
                {
                    numer: 1,
                    tytul: "Ciekawa trzynastka",
                    karty: {
                        N: "♠D<br>♥10 4<br>♦D 10 9 8 3<br>♣A K 9 7 6",
                        W: "♠9 6 3 2<br>♥A 6 5<br>♦K 4 2<br>♣10 8 5",
                        E: "♠A K 7 5<br>♥K W 9 7 3 2<br>♦6<br>♣W 2",
                        S: "♠W 10 8 4<br>♥D 8<br>♦A W 7 5<br>♣D 4 3"
                    },
                    warianty: [
                        {
                            nazwa: "Licytacja 1",
                            tabela: [
                                ["W", "N", "E", "S"],
                                ["-", "1♦", "1♥", "x!"],
                                ["2♥", "pas!", "3♥", "4♦"],
                                ["pas", "pas", "pas", ""]
                            ],
                            komentarz: "2BA otwieramy silne, więc Olga otworzyła 1♦, moja kontra oznaczała 4♠, brak kontry Olgi oznaczał maksimum 2 piki, zatem zdecydowałem się na 4♦ zakładając, że przegramy bez jednej, myślałem,że oddamy dwa piki i dwa kiery i nie dostaniemy kontry( miałem nadzieję, że Olga ma na otwarcie asa i króla trefl oraz króla z damą ♦)"
                        },
                        {
                            nazwa: "Licytacja 2",
                            tabela: [
                                ["W", "N", "E", "S"],
                                ["-", "2NT", "3♥", "4♦"],
                                ["pas", "pas", "pas", ""]
                            ],
                            komentarz: "2BA otwarcie podlimitowe na młodszych kolorach, wejście 3♥ naturalne solidne, 4♦ zawodnika S jak najbardziej usprawiedliwione i co ma zrobić W, wydaje się, że król karo może być bezwartościowy, więc trzy pasy kończą licytacje. Wynik jak na poprzednim stole bez jedne 100 dla EW i bardzo dobry zapis dla NS."
                        },
                        {
                            nazwa: "Licytacja 3",
                            tabela: [
                                ["W", "N", "E", "S"],
                                ["-", "pas", "1♥", "pas"],
                                ["2♥", "pas", "pas", "pas"]
                            ],
                            komentarz: "Uważam, że gracz N zachował się zbyt pasywnie, ma kartę idealną na wejście w drugim okrążeniu 2BA, co oznacza minimum 5-4 w kolorach młodszych. Wist As♦ wynik 110 dla  EW (powinno być 140)."
                        },
                        {
                            nazwa: "Licytacja 4",
                            tabela: [
                                ["W", "N", "E", "S"],
                                ["-", "1♣", "1♥", "1♠"],
                                ["2♥", "3♣", "3♥", "pas"],
                                ["pas", "pas", "", ""]
                            ],
                            komentarz: "Otwarcie 1♣ nie jest dobrym rozwiązaniem, zginął kolor karowy, otwarcie 1♣ wyklucza inny kolor pięciokartowy, jeżeli mamy poniżej 18PC. Wist D♣, wynik 9lew 140 dla EW (D♣ wistujemy z konfiguracji Dx lub DWx)"
                        },
                        {
                            nazwa: "Licytacja 5",
                            tabela: [
                                ["W", "N", "E", "S"],
                                ["-", "1♦", "1♥", "1♠"],
                                ["2♥", "3♣", "4♥!", "5♣!"],
                                ["pas", "pas", "pas", ""]
                            ],
                            komentarz: "Karta E jest ładna 6-4 skład i 4♥ może iść, teraz Isia na S została postawiona przed problemem, bronić czy nie bronić, 4♥ zostało zalicytowane z przeskokiem wskazując duże nadwyżki, widać z pozycji S, że obrona jest maksimum bez dwóch i w takich sytuacjach nie zawsze podejmujemy idealne decyzje. Proszę zauważyć, że E mając ♠3 i ♣3 kontrakt 4♥ zawsze wygra."
                        }
                    ],
                    podsumowanie: "W licytacji dwustronnej często nie ma idealnych rozwiązań, dlatego też z taką przyjemnością gramy w brydża."
                }
            ],
            
            stopka: {
                email: "mirek2338-png.github.io/Bridge",
                telefon: "797 802 411",
                redaktor: "Olga Jackiewicz",
                sponsorzy: "Miasto Ustka"
            }
        };
        
        // ============================================================
        // 🔧 FUNKCJE KOLORUJĄCE - NIE EDYTUJ!
        // ============================================================
        
        // Funkcja kolorująca symbole w dowolnym tekście
        function kolorujSymbole(tekst) {
            if (!tekst) return '';
            return tekst
                .replace(/♥/g, '<span class="heart">♥</span>')
                .replace(/♦/g, '<span class="diamond">♦</span>')
                .replace(/♠/g, '<span class="spade">♠</span>')
                .replace(/♣/g, '<span class="club">♣</span>');
        }
        
        // Funkcja kolorująca karty (zachowuje <br>)
        function kolorujKarty(kartyTekst) {
            if (!kartyTekst) return '';
            // Rozbijamy po <br>, kolorujemy każdą linię osobno i składamy
            let linie = kartyTekst.split('<br>');
            let kolorowaneLinie = linie.map(linia => kolorujSymbole(linia));
            return kolorowaneLinie.join('<br>');
        }
        
        // Generowanie tabeli licytacji z kolorowaniem
        function generujTabele(tabelaData) {
            let html = '<table class="bidding-table-compact">';
            for (let i = 0; i < tabelaData.length; i++) {
                let row = tabelaData[i];
                html += '<tr>';
                for (let cell of row) {
                    let cellHtml = kolorujSymbole(cell);
                    html += `<td>${cellHtml}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            return html;
        }
        
        // Główna funkcja generująca biuletyn
        function generujBiuletyn(dane) {
            let html = `<div class="container">
                <!-- NAGŁÓWEK -->
                <div class="header">
                    <h1>Biuletyn Brydżowy<small> ${dane.tytul}</small></h1>
                    <div class="tournament-info">
                        <span>📅 ${dane.data}</span>
                        <span>Omawia: ${dane.autor}</span>
                        <span>📞 ${dane.telefon}</span>
                        <span>✉ ${dane.email}</span>
                    </div>
                </div>
                
                <!-- SPIS TREŚCI -->
                <div class="toc">
                    <h2>📖 W tym numerze</h2>
                    <div class="toc-grid">`;
            
            for (let r of dane.rozdania) {
                html += `<div class="toc-item"><a href="#rozdanie${r.numer}">Rozdanie ${r.numer}: ${r.tytul}</a></div>`;
            }
            
            html += `</div>`;
            
            // Komentarz wstępny z kolorowaniem
            if (dane.komentarzWstepny && dane.komentarzWstepny.tresc) {
                html += `<div class="commentary-compact">
                    <strong>📝 ${kolorujSymbole(dane.komentarzWstepny.tytul)}:</strong>
                    <p>${kolorujSymbole(dane.komentarzWstepny.tresc)}</p>
                </div>`;
            }
            html += `</div>`;
            
            // Generowanie rozdań
            for (let r of dane.rozdania) {
                html += `
                <div id="rozdanie${r.numer}" class="deal">
                    <div class="deal-header">
                        <div class="deal-title">Rozdanie ${r.numer}: ${kolorujSymbole(r.tytul)}</div>
                        <div class="deal-number">nr ${r.numer}</div>
                    </div>
                    
                    <!-- DIAGRAM KART z kolorami -->
                    <div class="compact-board">
                        <div class="compact-north">
                            <div class="compact-hand north">
                                <div class="compact-position">N</div>
                                <div class="compact-cards">${kolorujKarty(r.karty.N)}</div>
                            </div>
                        </div>
                        <div class="compact-middle">
                            <div class="compact-hand west">
                                <div class="compact-position">W</div>
                                <div class="compact-cards">${kolorujKarty(r.karty.W)}</div>
                            </div>
                            <div class="compact-hand east">
                                <div class="compact-position">E</div>
                                <div class="compact-cards">${kolorujKarty(r.karty.E)}</div>
                            </div>
                        </div>
                        <div class="compact-south">
                            <div class="compact-hand south">
                                <div class="compact-position">S</div>
                                <div class="compact-cards">${kolorujKarty(r.karty.S)}</div>
                            </div>
                        </div>
                    </div>`;
                
                // Generowanie wariantów licytacji
                for (let w of r.warianty) {
                    html += `
                    <div class="deal-info-compact">
                        <div class="info-box-small">
                            <h4>📊 ${kolorujSymbole(w.nazwa)}</h4>
                            <div class="bidding-compact">
                                ${generujTabele(w.tabela)}
                            </div>
                        </div>
                        <div class="commentary-compact">
                            <strong>📝 Komentarz:</strong> ${kolorujSymbole(w.komentarz)}
                        </div>
                    </div>`;
                }
                
                // Podsumowanie rozdania z kolorowaniem
                if (r.podsumowanie) {
                    html += `
                    <div class="commentary-compact">
                        <strong>📝 Podsumowanie:</strong> ${kolorujSymbole(r.podsumowanie)}
                    </div>`;
                }
                
                html += `</div>`;
            }
            
            // STOPKA
            html += `
                <div class="footer">
                    <p>📧 ${dane.stopka.email} | 📞 ${dane.stopka.telefon}</p>
                    <p>Redaguje: ${dane.stopka.redaktor}</p>
                    <div class="sponsors">🏆 Sponsorzy: ${dane.stopka.sponsorzy}</div>
                </div>
            </div>`;
            
            document.getElementById('app').innerHTML = html;
        }
        
        // Uruchomienie
        generujBiuletyn(biuletyn);
    </script>
</body>
</html>
